[package]
name = "oneact-desktop"
version = "0.5.0"
description = "一幕 OneAct 桌面端（Tauri 2 封装 web 应用）"
edition = "2021"

[lib]
name = "oneact_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
