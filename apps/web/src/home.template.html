<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一幕 OneAct · 主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* ── 色板：远山蓝主题升级 ── */
    --bg: #f4f5f7; --bg-grad: #eef0f4;
    --panel: #ffffff; --panel-2: #fafbfc; --panel-glass: rgba(255,255,255,.72);
    --stage: #e8e6e0;
    --sidebar-bg: #fbfbfd;

    --border: rgba(20,20,30,.07); --border-2: rgba(20,20,30,.12); --border-3: rgba(20,20,30,.18);
    --text: #1a1b23; --text-2: #62666e; --text-3: #9aa0a8; --text-4: #c2c6cc;

    --accent: #5b5ef0; --accent-hover: #4a4ee0; --accent-soft: #ececfd; --accent-soft-2: #f5f5ff;
    --accent-2: #7c3aed; --accent-3: #c026d3;
    --accent-grad: linear-gradient(135deg, #5b5ef0 0%, #7c3aed 50%, #c026d3 100%);
    --accent-grad-hover: linear-gradient(135deg, #4a4ee0 0%, #6d28d9 50%, #a820b7 100%);

    --ink: #161521;
    --ok: #15803d; --ok-bg: #e7f6ec;
    --warn: #b45309; --warn-bg: #fdf3e3;
    --err: #dc2626; --err-bg: #fef2f2;

    /* ── 圆角系统 ── */
    --r-xs: 5px; --r-sm: 8px; --r-md: 10px; --r-lg: 14px; --r-xl: 18px; --r-2xl: 22px; --r-full: 999px;

    /* ── 阴影系统 ── */
    --shadow-xs: 0 1px 2px rgba(15,15,25,.04);
    --shadow-sm: 0 1px 3px rgba(15,15,25,.05), 0 1px 6px rgba(15,15,25,.05);
    --shadow-md: 0 2px 8px rgba(15,15,25,.06), 0 8px 28px rgba(15,15,25,.09);
    --shadow-lg: 0 4px 12px rgba(15,15,25,.08), 0 16px 48px rgba(15,15,25,.12);
    --shadow-pop: 0 8px 16px rgba(15,15,25,.10), 0 20px 60px rgba(15,15,25,.18);
    --shadow-accent: 0 4px 16px rgba(91,94,240,.25), 0 8px 32px rgba(124,58,237,.18);

    /* ── 动效 ── */
    --ease-out: cubic-bezier(.16,1,.3,1);
    --ease-spring: cubic-bezier(.34,1.56,.64,1);
    --dur-fast: .12s; --dur: .2s; --dur-slow: .35s;
  }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC","Microsoft YaHei","Source Han Sans SC",system-ui,-apple-system,sans-serif;
    background: var(--bg); color: var(--text); font-size: 13.5px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    font-feature-settings: "tnum","cv02","cv03";
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(20,20,30,.12); border-radius: var(--r-full); border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(20,20,30,.22); background-clip: padding-box; border: 2px solid transparent; }
  ::selection { background: var(--accent-soft); color: var(--accent); }

  /* ═══════════════════ 顶栏 ═══════════════════ */
  .titlebar {
    height: 56px; flex: none; display: flex; align-items: center;
    padding: 0 24px; gap: 16px; z-index: 6;
    background: var(--panel-glass);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 11px; flex: none; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: var(--r-md);
    background: var(--accent-grad);
    display: grid; place-items: center;
    box-shadow: 0 2px 10px rgba(91,94,240,.32), inset 0 1px 0 rgba(255,255,255,.3);
    transition: transform var(--dur) var(--ease-spring);
  }
  .brand:hover .brand-mark { transform: scale(1.06) rotate(-3deg); }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .brand-name em { font-style: normal; color: var(--text-3); font-weight: 400; font-size: 12.5px; margin-left: 6px; }

  .search-box {
    flex: 1; max-width: 460px; height: 38px;
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: var(--r-full);
    display: flex; align-items: center; gap: 8px; padding: 0 16px;
    transition: border-color var(--dur), box-shadow var(--dur), background var(--dur);
  }
  .search-box:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    background: var(--panel);
  }
  .search-box svg { flex: none; opacity: .4; transition: opacity var(--dur); }
  .search-box:focus-within svg { opacity: .7; }
  .search-box input {
    flex: 1; border: none; background: transparent; outline: none;
    font: inherit; font-size: 13.5px; color: var(--text);
  }
  .search-box input::placeholder { color: var(--text-3); }
  .search-box kbd {
    font-size: 10.5px; color: var(--text-3); background: var(--panel);
    border: 1px solid var(--border-2); border-bottom-width: 2px;
    padding: 2px 7px; border-radius: var(--r-xs); font-family: inherit;
    flex: none; opacity: 0; transition: opacity var(--dur);
  }
  .search-box:focus-within kbd { opacity: 0; }

  .spacer { flex: 1; }
  .btn {
    height: 34px; border: 1px solid var(--border-2); background: var(--panel);
    border-radius: var(--r-sm); padding: 0 15px; font-size: 13px; font-family: inherit;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: var(--shadow-xs); color: var(--text);
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast), transform var(--dur-fast);
  }
  .btn:hover { border-color: var(--border-3); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); box-shadow: var(--shadow-xs); }

  /* ═══════════════════ 主体布局 ═══════════════════ */
  .home-body { flex: 1; display: flex; min-height: 0; }

  /* ── 左侧导航栏 ── */
  .sidebar {
    width: 232px; flex: none; background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    padding: 20px 14px 16px;
    display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto;
  }
  .new-btn {
    height: 46px; border: none; border-radius: var(--r-md);
    background: var(--accent-grad); color: #fff;
    font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: var(--shadow-accent);
    transition: transform var(--dur) var(--ease-spring), box-shadow var(--dur), filter var(--dur-fast);
    margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .new-btn::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,.18), transparent 60%);
    pointer-events: none;
  }
  .new-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(91,94,240,.32), 0 12px 40px rgba(124,58,237,.2);
    filter: brightness(1.05);
  }
  .new-btn:active { transform: translateY(0); filter: brightness(.98); }

  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 13px; border-radius: var(--r-sm);
    font-size: 13.5px; color: var(--text-2); cursor: pointer;
    transition: background var(--dur-fast), color var(--dur-fast);
    position: relative;
  }
  .nav-item:hover { background: rgba(0,0,0,.035); color: var(--text); }
  .nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav-item.on::before {
    content: ""; position: absolute; left: -14px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 20px; background: var(--accent-grad); border-radius: 0 3px 3px 0;
  }
  .nav-item .ic {
    width: 20px; height: 20px; text-align: center;
    display: grid; place-items: center; font-size: 15px; flex: none;
  }
  .nav-sep { height: 1px; background: var(--border); margin: 10px 8px; }
  .nav-label {
    font-size: 10.5px; color: var(--text-3); font-weight: 600;
    padding: 4px 13px 2px; letter-spacing: .6px;
    text-transform: uppercase;
  }

  .sidebar-footer {
    margin-top: auto; padding: 14px 13px;
    font-size: 11px; color: var(--text-3); line-height: 1.7;
    border-top: 1px solid var(--border);
  }
  .sidebar-footer b { color: var(--text-2); font-weight: 600; }

  /* ── 右侧内容区 ── */
  .content {
    flex: 1; overflow-y: auto; padding: 28px 32px 48px; min-width: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-grad) 100%);
  }

  /* 页面标题行 */
  .content-h { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .content-h h2 { font-size: 20px; font-weight: 700; letter-spacing: -.4px; }
  .content-h .count {
    font-size: 12px; color: var(--text-3);
    background: var(--panel); border: 1px solid var(--border);
    padding: 3px 10px; border-radius: var(--r-full);
  }
  .content-h .spacer { flex: 1; }
  .sort-btn {
    font-size: 12px; color: var(--text-2); cursor: pointer;
    padding: 5px 12px; border-radius: var(--r-full);
    border: 1px solid var(--border); background: var(--panel);
    transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
  }
  .sort-btn:hover { background: var(--accent-soft-2); color: var(--accent); border-color: var(--accent-soft); }

  /* ═══════════════════ 文档网格 ═══════════════════ */
  .doc-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }
  .doc-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur) var(--ease-out);
    position: relative;
  }
  .doc-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-md);
    transform: translateY(-4px);
  }
  .doc-card:hover .doc-actions { opacity: 1; transform: translateY(0); }
  .doc-card:active { transform: translateY(-2px); }

  /* 缩略图区 */
  .doc-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, #f5f6f8, #ebedf0);
    position: relative; overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .doc-thumb .scaler {
    width: 1280px; height: 720px;
    transform: scale(.16); transform-origin: top left;
    pointer-events: none;
  }
  .doc-thumb-empty {
    display: grid; place-items: center; height: 100%;
    color: var(--text-4); font-size: 36px;
  }

  /* 卡片悬浮操作按钮 */
  .doc-actions {
    position: absolute; top: 10px; right: 10px;
    display: flex; gap: 5px; opacity: 0;
    transform: translateY(-4px);
    transition: opacity var(--dur), transform var(--dur);
    z-index: 2;
  }
  .doc-action-btn {
    width: 30px; height: 30px; border-radius: var(--r-sm);
    background: rgba(255,255,255,.94); border: 1px solid var(--border-2);
    display: grid; place-items: center; cursor: pointer;
    font-size: 14px; color: var(--text-2); box-shadow: var(--shadow-sm);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast), transform var(--dur-fast);
  }
  .doc-action-btn:hover {
    background: var(--panel); color: var(--accent); border-color: var(--accent);
    transform: scale(1.08);
  }
  .doc-action-btn.del:hover {
    color: var(--err); border-color: var(--err); background: var(--err-bg);
  }

  /* 卡片信息区 */
  .doc-info { padding: 12px 15px 14px; }
  .doc-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    letter-spacing: -.2px;
  }
  .doc-meta {
    font-size: 11.5px; color: var(--text-3); margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .doc-meta .dot {
    width: 3px; height: 3px; border-radius: 50%; background: var(--text-4);
  }

  /* ═══════════════════ 新建卡片 ═══════════════════ */
  .new-card {
    border: 2px dashed var(--border-3); background: transparent;
    box-shadow: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; aspect-ratio: auto; min-height: 180px;
    transition: border-color var(--dur), background var(--dur), transform var(--dur) var(--ease-out);
  }
  .new-card:hover {
    border-color: var(--accent); background: var(--accent-soft-2);
    transform: translateY(-4px); box-shadow: var(--shadow-md);
  }
  .new-card .plus {
    width: 48px; height: 48px; border-radius: var(--r-lg);
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 26px; font-weight: 300;
    transition: background var(--dur), color var(--dur), transform var(--dur) var(--ease-spring);
  }
  .new-card:hover .plus {
    background: var(--accent-grad); color: #fff;
    transform: scale(1.1) rotate(90deg);
  }
  .new-card .label { font-size: 13.5px; color: var(--text-2); font-weight: 500; }

  /* ═══════════════════ 模板卡片 ═══════════════════ */
  .tpl-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden; cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: border-color var(--dur), box-shadow var(--dur), transform var(--dur) var(--ease-out);
    position: relative;
  }
  .tpl-card::after {
    content: "使用"; position: absolute; top: 10px; left: 10px;
    font-size: 10.5px; font-weight: 600; color: var(--accent-2);
    background: rgba(255,255,255,.92); border: 1px solid var(--border);
    padding: 3px 9px; border-radius: var(--r-full);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    opacity: 0; transform: translateY(-4px);
    transition: opacity var(--dur), transform var(--dur);
    box-shadow: var(--shadow-xs); pointer-events: none;
  }
  .tpl-card:hover {
    border-color: var(--accent-2);
    box-shadow: var(--shadow-md);
    transform: translateY(-4px);
  }
  .tpl-card:hover::after { opacity: 1; transform: translateY(0); }
  .tpl-thumb {
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, #f5f6f8, #ebedf0);
    overflow: hidden; border-bottom: 1px solid var(--border);
  }
  .tpl-thumb .scaler {
    width: 1280px; height: 720px;
    transform: scale(.16); transform-origin: top left;
    pointer-events: none;
  }
  .tpl-info { padding: 12px 15px 14px; }
  .tpl-title { font-size: 14px; font-weight: 600; letter-spacing: -.2px; }
  .tpl-desc { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

  /* ═══════════════════ 空状态 ═══════════════════ */
  .empty-state {
    text-align: center; padding: 80px 20px; color: var(--text-3);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .empty-state .icon {
    width: 72px; height: 72px; border-radius: var(--r-xl);
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 32px; margin-bottom: 8px;
  }
  .empty-state .title { font-size: 16px; color: var(--text-2); font-weight: 600; }
  .empty-state .desc { font-size: 13px; }

  /* ═══════════════════ 弹窗 ═══════════════════ */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(15,15,25,.5);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: grid; place-items: center; z-index: 50;
    animation: mb-in var(--dur) var(--ease-out);
  }
  @keyframes mb-in { from { opacity: 0; } to { opacity: 1; } }
  .modal-bg.hidden { display: none; }
  .modal {
    width: 400px; background: var(--panel);
    border-radius: var(--r-xl); box-shadow: var(--shadow-pop);
    padding: 24px; border: 1px solid var(--border);
    animation: modal-in var(--dur-slow) var(--ease-spring);
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(.94) translateY(8px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 16px; letter-spacing: -.3px; }
  .modal p { font-size: 13.5px; color: var(--text-2); line-height: 1.6; margin-bottom: 4px; }
  .modal input {
    width: 100%; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: var(--r-sm);
    padding: 10px 12px; font: inherit; font-size: 13.5px; color: var(--text);
    outline: none; transition: border-color var(--dur), box-shadow var(--dur), background var(--dur);
  }
  .modal input:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--panel);
  }
  .modal .row { display: flex; gap: 10px; margin-top: 20px; }
  .modal .row .btn {
    flex: 1; justify-content: center; height: 38px; font-weight: 500;
  }
  .modal .row .btn.save {
    border: none; color: #fff;
    background: var(--accent-grad); box-shadow: var(--shadow-accent);
  }
  .modal .row .btn.save:hover {
    box-shadow: 0 6px 24px rgba(91,94,240,.32);
    filter: brightness(1.05); transform: translateY(-1px);
  }
  .modal .row .btn.danger {
    border: none; color: #fff;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    box-shadow: 0 4px 16px rgba(220,28,28,.25);
  }
  .modal .row .btn.danger:hover {
    box-shadow: 0 6px 24px rgba(220,28,28,.32);
    filter: brightness(1.05); transform: translateY(-1px);
  }

  /* ═══════════════════ Toast ═══════════════════ */
  .toast {
    position: fixed; bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(24px);
    background: var(--ink); color: #fff;
    padding: 12px 24px; border-radius: var(--r-full);
    font-size: 13.5px; font-weight: 500;
    box-shadow: var(--shadow-pop);
    opacity: 0; transition: opacity var(--dur-slow), transform var(--dur-slow) var(--ease-spring);
    z-index: 100; pointer-events: none;
    display: flex; align-items: center; gap: 8px;
  }
  .toast::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: #34d399; box-shadow: 0 0 8px rgba(52,211,153,.6);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ═══════════════════ 批量操作 ═══════════════════ */
  .batch-bar {
    display: flex; align-items: center; gap: 14px; margin-bottom: 18px;
    padding: 11px 16px; background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  }
  .batch-all { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none; }
  .batch-all input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .batch-count { font-size: 12.5px; color: var(--text-3); }
  .batch-count b { color: var(--accent); font-weight: 700; }
  .batch-btn {
    height: 32px; padding: 0 14px; border: 1px solid var(--border-2); background: var(--panel);
    border-radius: var(--r-sm); font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer;
    transition: border-color var(--dur-fast), box-shadow var(--dur-fast), background var(--dur-fast);
  }
  .batch-btn:hover { border-color: var(--border-3); box-shadow: var(--shadow-xs); }
  .batch-btn.danger { color: var(--err); border-color: #f3c4c4; background: var(--err-bg); }
  .batch-btn.danger:hover { background: #fdeaea; border-color: var(--err); }
  .batch-btn.danger:disabled { opacity: .45; cursor: not-allowed; }
  .doc-card.batch { cursor: default; }
  .doc-card.batch .doc-actions { display: none; }
  .doc-card.batch:hover { transform: none; border-color: var(--border); box-shadow: var(--shadow-sm); }
  .doc-card.selected { border-color: var(--accent) !important; box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md) !important; }
  .batch-check {
    position: absolute; top: 10px; left: 10px; z-index: 3; width: 24px; height: 24px;
    border-radius: var(--r-sm); background: rgba(255,255,255,.94); border: 2px solid var(--border-3);
    display: grid; place-items: center; font-size: 13px; color: transparent; font-weight: 700;
    box-shadow: var(--shadow-sm); transition: background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  }
  .doc-card.selected .batch-check { background: var(--accent-grad); border-color: transparent; color: #fff; }

  /* ═══════════════════ 关于 / 帮助 静态页 ═══════════════════ */
  .static-page { max-width: 840px; }
  .hero-card {
    display: flex; align-items: center; gap: 18px; padding: 24px 26px; margin-bottom: 18px;
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--r-xl); box-shadow: var(--shadow-sm);
  }
  .hero-logo {
